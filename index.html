    <!-- Redirect legado: /#/planner → /planner (preserva UTMs e parâmetros de campanha) -->
    <script>
      (function () {
        var hash = window.location.hash || '';
        if (hash !== '#/planner' && hash.indexOf('#/planner?') !== 0) return;
        var params = new URLSearchParams(window.location.search);
        var rest = hash.slice('#/planner'.length);
        if (rest.charAt(0) === '?') rest = rest.slice(1);
        if (rest) {
          new URLSearchParams(rest).forEach(function (value, key) {
            if (!params.has(key)) params.set(key, value);
          });
        }
        var query = params.toString();
        window.location.replace('/planner' + (query ? '?' + query : ''));
      })();
    </script>
